<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <button id="chat-btn" onclick="toggleChat()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Live Chat</span>
    </button>

    <div id="chat-window">
        <div class="chat-header">
            <div class="header-info">
                <div class="status-dot"></div>
                <span id="header-title">Support Team</span>
            </div>
            <div class="header-controls">
                <select id="lang-select" onchange="changeLanguage()">
                    <option value="en">EN</option>
                    <option value="es">ES</option>
                </select>
                <button class="close-btn" onclick="toggleChat()">✕</button>
            </div>
        </div>
        
        <div id="banned-screen" class="screen-center" style="display: none;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#f04747" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
            <h3 style="color: #f04747;">Access Denied</h3>
            <p>You have been banned from support.</p>
        </div>

        

        <!-- Pre-Chat Form with Email / Username Field -->
        <div id="pre-chat" class="screen-center">
            <h3 id="txt-welcome">Welcome!</h3>
            <p id="txt-sub">Please fill out the details below to connect with an agent.</p>
            
            <div class="input-group">
                <label>Product / Department</label>
                <select id="dept-select" onchange="checkDept()">
                    <option value="General Support">General Support</option>
                    <option value="Flash Ghost">Flash Ghost</option>
                    <option value="Valorant Internal">Valorant Internal</option>
                    <option value="ESP32-S Configuration">ESP32-S Configuration</option>
                    <option value="Payment / License Issue">Payment / License Issue</option>
                </select>
            </div>

            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="user-name-input" placeholder="e.g. John Doe">
            </div>

            <!-- Added Email or Username Field -->
            <div class="input-group">
                <label>Email or Username / User ID</label>
                <input type="text" id="user-email-input" placeholder="e.g. user@example.com or username">
            </div>

            <div class="input-group" id="order-id-div" style="display: none;">
                <label>Order ID / Crypto Hash</label>
                <input type="text" id="order-id-input" placeholder="Optional">
            </div>

            <button id="btn-start" class="primary-btn" onclick="startChat()">Start Chat</button>
        </div>

        <!-- Active Chat Area -->
        <div id="chat-main" style="display: none;">
            <div class="chat-body" id="chat-messages">
                <div class="msg support">
                    <div class="msg-avatar">S</div>
                    <div class="msg-content">
                        Hello! How can we help you today?<br>
                        <b style="color:var(--accent); font-size:11px; display:block; margin-top:4px;">💡 Available Commands:</b>
                        <span style="font-size:11px; color:var(--text-muted);">Type or click <code style="color:white;">!status</code> or <code style="color:white;">!pricing</code> below.</span>
                    </div>
                </div>
            </div>
            
            <div class="quick-actions">
                <button onclick="triggerQuickAction('!status')">🟢 System Status</button>
                <button onclick="triggerQuickAction('!pricing')">🛒 View Pricing</button>
            </div>

            <div id="typing-indicator"></div>
            
            <div class="chat-footer">
                <div class="input-row">
                    <input type="text" id="msg-input" placeholder="Type a message..." oninput="sendTyping()" onkeypress="if(event.key==='Enter')sendMessage()">
                    <button id="btn-send" onclick="sendMessage()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="footer-tools">
                    <label class="file-label">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        <span id="file-name-text">Attach File</span>
                        <input type="file" id="file-input" style="display: none;" onchange="updateFileName()">
                    </label>
                    <span id="file-error" style="color:#f04747; font-size:11px; display:none;"></span>
                </div>
            </div>
        </div>
    </div>

    <audio id="sound-msg" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="sound-join" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>
    <audio id="sound-close" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
